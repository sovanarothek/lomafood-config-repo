spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lomafood
    username: u0_a758
    password: roth2025k@1
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Payment Providers
payment:
  aba:
    merchant-id: your-aba-merchant-id
    api-key: your-aba-api-key
    api-url: https://pay.ababank.com/api
  wing:
    merchant-id: your-wing-merchant-id
    api-key: your-wing-api-key
    api-url: https://api.wingmoney.com
  acleda:
    merchant-id: your-acleda-merchant-id
    api-key: your-acleda-api-key
    api-url: https://api.acledabank.com.kh
  ppcbank:
    merchant-id: your-ppcbank-merchant-id
    api-key: your-ppcbank-api-key
    api-url: https://api.ppcbank.com.kh
  bakong:
    merchant-id: your-bakong-merchant-id
    api-key: your-bakong-api-key
    api-url: https://api-bakong.nbc.gov.kh

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
